[project]
name = "spamshield"
version = "1.0.0"
description = "Explainable spam detection for messages and mailboxes, built on scikit-learn and Streamlit."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Saksham Garg" }]
requires-python = ">=3.10"
keywords = ["spam-detection", "machine-learning", "nlp", "scikit-learn", "streamlit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email :: Filters",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "joblib>=1.3",
    "pandas>=2.1",
    "scikit-learn>=1.5",
    "streamlit>=1.50",
]

[project.scripts]
spamshield = "spamshield.cli:main"

[project.urls]
Repository = "https://github.com/sakshamg251206/spamshield"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.1",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spamshield"]

# ---------------------------------------------------------------- tooling ---

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle + pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RUF",          # ruff-specific
    "PTH",          # prefer pathlib
    "S",            # bandit (security)
]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
strict = true
files = ["src", "app.py"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "scipy.*", "bs4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: trains a model end to end (deselect with -m 'not slow')"]
filterwarnings = ["error::FutureWarning:spamshield.*"]

[tool.coverage.run]
source = ["spamshield"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
